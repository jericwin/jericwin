<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="About Jeric Punay: Data Analyst, Software Developer, AI Enthusiast. Building data analytics projects, BI dashboards and full-stack web apps. Learning AI/ML, AWS, Azure, Docker and Kubernetes. Open to open source, AI and data analytics collaborations.">
<style>
.h{font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:13px;fill:#60a5fa;letter-spacing:2px}
.c{font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:14.5px}
.k{fill:#60a5fa}.p{fill:#475569}.v{fill:#e2e8f0}.s{fill:#94a3b8;font-style:italic}.n{fill:#334155}
.l{opacity:0;animation:type .5s steps(12) forwards}
@keyframes type{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#131c2e"/></pattern>
</defs>
<rect width="900" height="270" rx="18" fill="#05070d"/>
<rect width="900" height="270" rx="18" fill="url(#grid)"/>
<rect x=".5" y=".5" width="899" height="269" rx="18" fill="none" stroke="#3b82f6" stroke-opacity=".35"/>
<circle cx="34" cy="33" r="5" fill="#1e3a8a"/><circle cx="52" cy="33" r="5" fill="#2563eb"/><circle cx="70" cy="33" r="5" fill="#60a5fa"/>
<text class="h" x="866" y="38" text-anchor="end">~/jeric/about.yml</text>
<line x1="34" y1="56" x2="866" y2="56" stroke="#1e293b"/>
<g class="c">
  <text class="l" x="34" y="90" style="animation-delay:.2s"><tspan class="n">01  </tspan><tspan class="k">name</tspan><tspan class="p">:      </tspan><tspan class="v">Jeric Punay</tspan></text>
  <text class="l" x="34" y="116" style="animation-delay:.5s"><tspan class="n">02  </tspan><tspan class="k">roles</tspan><tspan class="p">:     [ </tspan><tspan class="v">Data Analyst</tspan><tspan class="p">, </tspan><tspan class="v">Software Developer</tspan><tspan class="p">, </tspan><tspan class="v">AI Enthusiast</tspan><tspan class="p"> ]</tspan></text>
  <text class="l" x="34" y="142" style="animation-delay:.8s"><tspan class="n">03  </tspan><tspan class="k">building</tspan><tspan class="p">:  [ </tspan><tspan class="v">Data analytics</tspan><tspan class="p">, </tspan><tspan class="v">BI dashboards</tspan><tspan class="p">, </tspan><tspan class="v">Full-stack web apps</tspan><tspan class="p"> ]</tspan></text>
  <text class="l" x="34" y="168" style="animation-delay:1.1s"><tspan class="n">04  </tspan><tspan class="k">learning</tspan><tspan class="p">:  [ </tspan><tspan class="v">AI/ML</tspan><tspan class="p">, </tspan><tspan class="v">AWS</tspan><tspan class="p">, </tspan><tspan class="v">Azure</tspan><tspan class="p">, </tspan><tspan class="v">Docker</tspan><tspan class="p">, </tspan><tspan class="v">Kubernetes</tspan><tspan class="p"> ]</tspan></text>
  <text class="l" x="34" y="194" style="animation-delay:1.4s"><tspan class="n">05  </tspan><tspan class="k">open_to</tspan><tspan class="p">:   [ </tspan><tspan class="v">Open source</tspan><tspan class="p">, </tspan><tspan class="v">AI</tspan><tspan class="p">, </tspan><tspan class="v">Data analytics collabs</tspan><tspan class="p"> ]</tspan></text>
  <text class="l" x="34" y="230" style="animation-delay:1.7s"><tspan class="n">06  </tspan><tspan class="k">motto</tspan><tspan class="p">:     </tspan><tspan class="s">"Data tells a story, and great software brings that story to life."</tspan><tspan class="k cur"> ▌</tspan></text>
