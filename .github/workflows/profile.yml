name: Profile assets

# Regenerates the stats card and contribution snake, then publishes them
# to the `output` branch that README.md points at.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stats card
        run: python scripts/gen_stats.py ${{ github.repository_owner }} dist/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#3b82f6&color_dots=#111a2e,#1e3a8a,#2563eb,#60a5fa,#bfdbfe

      - name: Wrap snake in card
        run: python scripts/wrap_snake.py dist/snake.svg

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
